<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>CASTIGO · Smash balístico · VOIDCROWN</title>
<script src="three.min.js"></script>
<script src="../js/commander_meta.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#02040a;color:#e8eefc;font-family:system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);pointer-events:none}
.hud *{pointer-events:auto}
.hud h1{font-size:11px;letter-spacing:.22em;color:#ff4d3a}
.title{font-size:14px;font-weight:800;color:#ffc857;margin-top:4px}
.stats{position:fixed;top:64px;right:10px;z-index:5;width:150px;padding:10px;border-radius:12px;background:rgba(8,12,20,.88);border:1px solid rgba(255,77,58,.35);font-size:11px;line-height:1.45}
.stats b{color:#5ef2d0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent)}
button{border:1px solid rgba(255,77,58,.4);background:rgba(30,10,14,.92);color:#fff;border-radius:12px;padding:10px 12px;font-size:11px;font-weight:700;min-height:44px}
button.on{box-shadow:0 0 0 2px #ffc857}
button.ghost{border-color:rgba(94,242,208,.35);background:rgba(10,20,24,.9)}
#edai{position:fixed;left:10px;bottom:100px;z-index:7;max-width:78%;padding:10px 12px;border-radius:14px;background:rgba(10,14,24,.92);border:1px solid rgba(177,140,255,.4);font-size:12px}
#edai .who{font-size:10px;letter-spacing:.16em;color:#b18cff;margin-bottom:4px}
a.back{color:#5ef2d0;text-decoration:none;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(94,242,208,.3);background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <a class="back" href="consejo.html">← Consejo</a>
  <h1>CASTIGO · BALÍSTICA</h1>
  <div class="title" id="cmdTitle">Comandante</div>
</div>
<div class="stats">
  Integridad <b id="hp">100</b>%<br/>
  Corteza <b id="crust">100</b><br/>
  Manto <b id="mantle">100</b><br/>
  Núcleo <b id="coreHp">100</b><br/>
  Vivos <b id="pop">812M</b><br/>
  Caídos <b id="dead">0</b><br/>
  Caos <b id="chaos">0</b><br/>
  Munición <b id="ammo">∞</b>
</div>
<div id="edai"><div class="who">EDAI · CASTIGO</div><div id="line">Elige arma. El proyectil vuela con física real antes del impacto.</div></div>
<div class="bar">
  <button type="button" class="on" data-w="kinetic">⚒ Martillo</button>
  <button type="button" data-w="swarm">✴ Enjambre</button>
  <button type="button" data-w="laser">✦ Láser</button>
  <button type="button" data-w="meteor">☄ Lluvia</button>
  <button type="button" data-w="rift">◎ Grieta</button>
  <button type="button" data-w="bifurcate">✂ Bifurcador</button>
  <button type="button" data-w="nova">◉ Nova</button>
  <button type="button" class="ghost" data-w="reset">↺ Regen</button>
  <button type="button" class="ghost" onclick="location.href='orbita_flotas.html'">Órbita</button>
</div>
<script>
(function(){
const M=window.VCMeta; const meta=M.load();
document.getElementById('cmdTitle').textContent=meta.title;
const POP0=812e6;
const KEY='vc-castigo-ballistic-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}
function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';return String(n|0)}
function say(t){document.getElementById('line').textContent=t}

let st=Object.assign({hp:100,crust:100,mantle:100,core:100,dead:0,chaos:0,ammo:12,weapon:'kinetic',bifurcated:false}, load());
const RINGS=18, SECTORS=36;
if(!st.voxels){st.voxels=[]; for(let r=0;r<RINGS;r++){const row=[];for(let s=0;s<SECTORS;s++)row.push(1);st.voxels.push(row)}}

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x02040a);
const camera=new THREE.PerspectiveCamera(42,1,0.1,200);
camera.position.set(0,0.2,3.4);
const dl=new THREE.DirectionalLight(0xffffff,1.2); dl.position.set(4,2,5); scene.add(dl);
scene.add(new THREE.AmbientLight(0x334466,0.5));
scene.add(new THREE.HemisphereLight(0xff6b4a,0x110022,0.25));

const loader=new THREE.TextureLoader();
const day=loader.load('../tex/earth_day_hq.png');
try{day.colorSpace=THREE.SRGBColorSpace}catch(e){}
const planetGeo=new THREE.SphereGeometry(1,64,64);
const planetMat=new THREE.MeshStandardMaterial({map:day,roughness:0.85,metalness:0.05,emissive:0x1a1520,emissiveIntensity:0.35});
const planet=new THREE.Mesh(planetGeo, planetMat); scene.add(planet);
// second half for bifurcate
const halfMat=planetMat.clone();
const halfA=new THREE.Mesh(new THREE.SphereGeometry(1,48,48,0,Math.PI), halfMat);
const halfB=new THREE.Mesh(new THREE.SphereGeometry(1,48,48,Math.PI,Math.PI), halfMat.clone());
halfA.visible=false; halfB.visible=false; scene.add(halfA); scene.add(halfB);

const atmo=new THREE.Mesh(new THREE.SphereGeometry(1.08,32,32), new THREE.MeshBasicMaterial({color:0xff4d3a,transparent:true,opacity:0.06,side:THREE.BackSide}));
scene.add(atmo);

const projectiles=[]; // {mesh,vel,weapon,life}
const debris=[]; // {mesh,vel,spin}
const scars=new THREE.Group(); scene.add(scars);

const WEAPONS={
  kinetic:{name:'Martillo cinético', dmg:14, ammo:1, color:0xffaa44, speed:4.2, mass:1.4, shake:0.12},
  swarm:{name:'Enjambre ×5', dmg:5, ammo:1, color:0x5ef2d0, speed:3.5, mass:0.5, shake:0.06, count:5},
  laser:{name:'Láser de manto', dmg:9, ammo:0, color:0x55eef2, speed:18, mass:0.1, shake:0.05, beam:true},
  meteor:{name:'Lluvia meteórica', dmg:7, ammo:1, color:0xff6622, speed:2.8, mass:1, shake:0.1, count:4},
  rift:{name:'Grieta gravitacional', dmg:11, ammo:1, color:0x7b5cff, speed:2.2, mass:2, shake:0.14},
  bifurcate:{name:'Rayo Bifurcador', dmg:28, ammo:1, color:0xffee88, speed:6, mass:1.2, shake:0.22, special:'split'},
  nova:{name:'Nova de vacío', dmg:40, ammo:1, color:0xffffff, speed:1.5, mass:3, shake:0.3, special:'nova'},
};

function ui(){
  document.getElementById('hp').textContent=Math.max(0,st.hp|0);
  document.getElementById('crust').textContent=Math.max(0,st.crust|0);
  document.getElementById('mantle').textContent=Math.max(0,st.mantle|0);
  document.getElementById('coreHp').textContent=Math.max(0,st.core|0);
  document.getElementById('pop').textContent=fmt(Math.max(0,POP0-st.dead));
  document.getElementById('dead').textContent=fmt(st.dead);
  document.getElementById('chaos').textContent=st.chaos|0;
  document.getElementById('ammo').textContent=st.ammo;
  save(st);
}
function shake(mag){
  camera.userData.shake=Math.max(camera.userData.shake||0, mag);
}

function spawnDebris(point, normal, n, color){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(
      new THREE.TetrahedronGeometry(0.04+Math.random()*0.06,0),
      new THREE.MeshStandardMaterial({color:color||0x886655, roughness:0.9})
    );
    m.position.copy(point);
    const dir=normal.clone().add(new THREE.Vector3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).multiplyScalar(0.8)).normalize();
    debris.push({mesh:m, vel:dir.multiplyScalar(0.8+Math.random()*1.4), spin:new THREE.Vector3(Math.random(),Math.random(),Math.random())});
    scene.add(m);
  }
}

function applyLayers(dmg){
  const mult=M.smashDmgMult();
  dmg*=mult;
  let left=dmg;
  const take=(key,ratio)=>{const t=Math.min(st[key], left*ratio); st[key]=Math.max(0,st[key]-t); left-=t};
  take('crust',1); if(left>0) take('mantle',1); if(left>0) take('core',1);
  st.hp=Math.round((st.crust+st.mantle+st.core)/3);
  st.dead=Math.min(POP0, st.dead+Math.floor(dmg*densPop()*90000));
  st.chaos+=Math.ceil(dmg/3);
  if(st.hp<=0){ st.hp=0; say('VOID. El mundo es herida.'); M.bumpStat('worldsVoided',1); M.addXP(60,'Mundo en VOID'); M.addCredits(50,'Castigo'); }
}

function densPop(){return 0.7+Math.random()*0.5}

function impact(point, normal, weapon){
  const w=WEAPONS[weapon];
  applyLayers(w.dmg*(0.85+Math.random()*0.3));
  shake(w.shake);
  planet.material.emissiveIntensity=0.9;
  setTimeout(()=>{planet.material.emissiveIntensity=0.35},200);
  spawnDebris(point, normal, 8+Math.floor(w.dmg/2), w.color);
  const scar=new THREE.Mesh(new THREE.SphereGeometry(0.05+w.dmg*0.004,8,8), new THREE.MeshBasicMaterial({color:w.color,transparent:true,opacity:0.85}));
  scar.position.copy(normal.clone().multiplyScalar(1.01));
  scars.add(scar);
  // voxel hit
  const n=normal.clone().normalize();
  const ring=Math.min(RINGS-1,Math.max(0,Math.floor((0.5-Math.asin(Math.max(-1,Math.min(1,n.y)))/Math.PI)*RINGS)));
  const sector=Math.min(SECTORS-1,Math.max(0,Math.floor(((Math.atan2(n.x,n.z)+Math.PI)/(Math.PI*2))*SECTORS)));
  st.voxels[ring][sector]=Math.max(0, st.voxels[ring][sector]-0.5);
  if(w.special==='split' && !st.bifurcated && st.hp<70){
    st.bifurcated=true; planet.visible=false; halfA.visible=true; halfB.visible=true;
    halfA.position.set(-0.15,0,0); halfB.position.set(0.15,0,0);
    say('Rayo Bifurcador: el planeta se parte en dos mitades.');
    spawnDebris(point, normal, 30, 0xffee88);
  }
  if(w.special==='nova'){
    st.crust=0; st.mantle=Math.max(0,st.mantle-40); applyLayers(5);
    say('Nova de vacío: atmósfera y corteza diezmadas.');
  }
  if(st.hp<50){ try{const s=M.load(); /* mission smash_50 */ 
    (s.missions||[]).forEach(m=>{if(m.check==='smash_50'&&!m.done){m.done=true;M.addXP(m.rewardXP,m.name);M.addCredits(m.rewardCR,m.name);M.bumpStat('missionsDone',1)}});
  }catch(e){} }
  say(`${w.name} impacta · HP ${st.hp} · caos ${st.chaos}`);
  ui();
}

function fireToward(targetPoint){
  const w=WEAPONS[st.weapon];
  if(!w) return;
  if(w.ammo && st.ammo<=0){say('Sin munición especial');return}
  if(w.ammo) st.ammo--;
  const count=w.count||1;
  for(let i=0;i<count;i++){
    const start=camera.position.clone().add(new THREE.Vector3((Math.random()-0.5)*0.3,(Math.random()-0.5)*0.2,-0.2));
    const aim=targetPoint.clone().add(new THREE.Vector3((Math.random()-0.5)*0.15*(count>1),(Math.random()-0.5)*0.15*(count>1),(Math.random()-0.5)*0.15*(count>1)));
    const dir=aim.clone().sub(start).normalize();
    const mesh=new THREE.Mesh(
      w.beam? new THREE.CapsuleGeometry(0.02,0.25,4,8): new THREE.SphereGeometry(0.05+w.mass*0.02,10,10),
      new THREE.MeshBasicMaterial({color:w.color})
    );
    mesh.position.copy(start);
    scene.add(mesh);
    projectiles.push({mesh, vel:dir.multiplyScalar(w.speed), weapon:st.weapon, life:4, trail:w.beam});
  }
  say(`${w.name} en vuelo…`);
  ui();
}

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
let dragging=false, lx=0, ly=0, moved=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;moved=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return; const dx=e.clientX-lx, dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
  planet.rotation.y+=dx*0.005; planet.rotation.x=Math.max(-0.9,Math.min(0.9,planet.rotation.x+dy*0.003));
  halfA.rotation.copy(planet.rotation); halfB.rotation.copy(planet.rotation);
  lx=e.clientX; ly=e.clientY;
});
canvas.addEventListener('pointerup',e=>{
  dragging=false;
  if(moved>12) return;
  const r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(planet.visible?planet:halfA);
  if(hits[0]) fireToward(hits[0].point);
});

document.querySelectorAll('[data-w]').forEach(b=>{
  b.onclick=()=>{
    const w=b.getAttribute('data-w');
    if(w==='reset'){
      st={hp:100,crust:100,mantle:100,core:100,dead:0,chaos:0,ammo:12,weapon:'kinetic',bifurcated:false,voxels:st.voxels.map(r=>r.map(()=>1))};
      planet.visible=true; halfA.visible=false; halfB.visible=false;
      while(scars.children.length) scars.remove(scars.children[0]);
      debris.splice(0).forEach(d=>scene.remove(d.mesh));
      say('Mundo regenerado en el laboratorio.');
      ui(); return;
    }
    st.weapon=w; document.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    say(WEAPONS[w].name+' listo. Toca el planeta para trazar trayectoria.');
  };
});

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize(); ui();
say('7 armas. Física de proyectil. Fractura y escombros. Título: '+meta.title);

const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05, clock.getDelta());
  // projectiles physics
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    // gravity toward planet center (soft)
    const toC=p.mesh.position.clone().multiplyScalar(-1).normalize().multiplyScalar(1.2*dt);
    p.vel.add(toC);
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
    p.life-=dt;
    // hit test sphere r=1
    if(p.mesh.position.length()<=1.02){
      const n=p.mesh.position.clone().normalize();
      impact(n.clone().multiplyScalar(1.01), n, p.weapon);
      scene.remove(p.mesh); projectiles.splice(i,1); continue;
    }
    if(p.life<=0||p.mesh.position.length()>20){scene.remove(p.mesh);projectiles.splice(i,1)}
  }
  // debris
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i];
    d.vel.y-=0.15*dt;
    d.mesh.position.add(d.vel.clone().multiplyScalar(dt));
    d.mesh.rotation.x+=d.spin.x*dt; d.mesh.rotation.y+=d.spin.y*dt;
    d.vel.multiplyScalar(0.995);
    if(d.mesh.position.length()>8){scene.remove(d.mesh);debris.splice(i,1)}
  }
  if(st.bifurcated){
    halfA.position.x-=0.03*dt; halfB.position.x+=0.03*dt;
    halfA.rotation.y+=0.05*dt; halfB.rotation.y-=0.05*dt;
  } else {
    planet.rotation.y+=0.05*dt;
  }
  // camera shake
  if(camera.userData.shake>0){
    camera.position.x=(Math.random()-0.5)*camera.userData.shake;
    camera.position.y=0.2+(Math.random()-0.5)*camera.userData.shake;
    camera.userData.shake*=0.9;
    if(camera.userData.shake<0.002){camera.userData.shake=0;camera.position.x=0;camera.position.y=0.2}
  }
  renderer.render(scene,camera);
})();
})();
</script>
</body>
</html>
